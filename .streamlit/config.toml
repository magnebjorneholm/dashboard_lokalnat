# .streamlit/config.toml
# Regumetrica - Nordic Blue grafisk profil
# Professionell design för elmarknadsanalys och regulatory affairs
# Streamlit 1.52.2

[theme]
base = "light"

# Primärfärg - Nordic Blue för consulting/finance-känsla
primaryColor = "#2563EB"

# Huvudbakgrund - ljus nordisk slate
backgroundColor = "#F8FAFC"

# Sekundär bakgrund för kort, expanders, sidopanel
secondaryBackgroundColor = "#F1F5F9"

# Textfärg - mörkblå slate för optimal läsbarhet
textColor = "#0F172A"

# Typografi - sans serif (Inter laddas via CSS)
font = "sans serif"


[server]
port = 8501
headless = false
runOnSave = false
fileWatcherType = "poll"
maxUploadSize = 200
maxMessageSize = 200
enableStaticServing = true


[client]
showErrorDetails = true
toolbarMode = "auto"
showSidebarNavigation = true


[browser]
gatherUsageStats = false


[runner]
magicEnabled = true
fastReruns = true