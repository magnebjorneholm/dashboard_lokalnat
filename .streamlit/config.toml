# .streamlit/config.toml

# ============================================================================
# THEME - HUVUDTEMA
# ============================================================================
[theme]
# === BAS-TEMA ===
base = "light"

# === FÄRGER ===
primaryColor = "#0066CC"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2C3E50"

# === LINKS ===
linkColor = "#0066CC"
linkUnderline = false

# === TYPOGRAFI ===
font = "sans-serif"
baseFontSize = 16
baseFontWeight = 400

headingFont = "sans-serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]

codeFont = "monospace"
codeBackgroundColor = "#F0F2F6"

# === BORDERS & RADIER ===
baseRadius = "4px"
buttonRadius = "4px"
borderColor = "#E2E8F0"
dataframeBorderColor = "#CBD5E1"
dataframeHeaderBackgroundColor = "#1E3A5F"
showWidgetBorder = true
showSidebarBorder = true

# === FÄRGPALETT ===
greenColor = "#10B981"
yellowColor = "#F59E0B"
redColor = "#DC2626"

# === CHART-FÄRGER ===
chartCategoricalColors = [
    "#0066CC",
    "#0088FF",
    "#10B981",
    "#F59E0B",
    "#DC2626"
]

# ============================================================================
# THEME.SIDEBAR - SIDEBAR-TEMA (Separat sektion!)
# ============================================================================
[theme.sidebar]
backgroundColor = "#1E3A5F"
secondaryBackgroundColor = "#2C3E50"
textColor = "#FFFFFF"
primaryColor = "#0088FF"
linkColor = "#FFFFFF"

# ============================================================================
# SERVER - ENDAST EN GÅNG!
# ============================================================================
[server]
port = 8501
runOnSave = false
maxUploadSize = 200
fileWatcherType = "poll"

# ============================================================================
# CLIENT
# ============================================================================
[client]
toolbarMode = "auto"
showSidebarNavigation = true

# ============================================================================
# RUNNER
# ============================================================================
[runner]
magicEnabled = true
fastReruns = true