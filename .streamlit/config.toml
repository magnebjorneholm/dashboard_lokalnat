# .streamlit/config.toml
# Giltig konfiguration för Streamlit - professionell mörkblå profil för elmarknadsanalys
# Innehåller ENDAST färger som stöds av Streamlit

[theme]
base = "light"

# === GRUNDFÄRGER (ALLA DESSA FUNGERAR) ===
primaryColor = "#0066CC"              # Primär blå för länkar och interaktiva element
backgroundColor = "#F5F7FA"           # Ljus huvudbakgrund
secondaryBackgroundColor = "#FFFFFF"  # Vit för innehållscontainers
textColor = "#2C3E50"                 # Mörkgrå text för läsbarhet

# Typografi (endast font stöds)
font = "sans-serif"

# Sidebar
[theme.sidebar]
backgroundColor = "#1E3A5F"        # Mörkblå sidebar
secondaryBackgroundColor = "#2C3E50"
textColor = "#FFFFFF"              # Vit text i sidebar
primaryColor = "#0088FF"           # Ljusare blå för länkar i sidebar

# Server
[server]
port = 8501
headless = false
runOnSave = false
fileWatcherType = "poll"
maxUploadSize = 200
maxMessageSize = 200
enableCORS = true
enableXsrfProtection = true
enableWebsocketCompression = false

[client]
showErrorDetails = true
toolbarMode = "auto"
showSidebarNavigation = true

[browser]
serverAddress = "localhost"
serverPort = 8501
gatherUsageStats = false

[runner]
magicEnabled = true
fastReruns = true
enforceSerializableSessionState = false

[logger]
level = "info"
messageFormat = "%(asctime)s %(message)s"